[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remembrance-mcp"
version = "2.0.0"
description = "Universal memory system for AI agents: knowledge graph, compiled truth, dream cycle"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
nats = ["nats-py>=2.0.0"]
gate = [
    "torch>=2.0.0",
    "transformers>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.0",
]
all = [
    "mcp>=1.0.0",
    "nats-py>=2.0.0",
    "torch>=2.0.0",
    "transformers>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.0",
]

[project.scripts]
remembrance-mcp = "remembrance_mcp:main"
remembrance-service = "remembrance_mcp.serve:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# NOTE: --cov is intentionally NOT in addopts so plain/subset `pytest` runs
# behave normally. Coverage + the fail-under gate are invoked explicitly in CI
# (see .github/workflows/ci.yml).

[tool.coverage.run]
source = ["remembrance_mcp"]
# statement coverage only (no branch) so the number matches the fail_under floor

[tool.coverage.report]
show_missing = true
# Phase 0 safety net (deferred-hardening Concern C item 3). Ratchet FLOOR, not
# the target: current coverage is ~64%; roadmap target is ~80%. Raise this as
# suites expand — never lower it. 60 leaves headroom for the minimal-vs-all
# matrix leg difference (minimal skips the mcp test) and flake variance.
fail_under = 60

[tool.ruff]
# Phase 0 safety net (deferred-hardening Concern C item 2). Config only here;
# the mechanical `ruff format` / `--fix` pass lands as its own commit (task 0.2b).
line-length = 100  # p99 of the codebase is 99 cols; only ~0.9% of lines exceed 100
target-version = "py310"  # matches requires-python = ">=3.10"
src = ["src"]
extend-exclude = ["*.egg-info", "build", "dist"]

[tool.ruff.lint]
# Start lenient (Concern B); tighten (UP/B/etc.) in a later dedicated pass.
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, isort

[tool.ruff.lint.isort]
known-first-party = ["remembrance_mcp"]
