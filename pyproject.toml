[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-mcp"
version = "2.1.0"
description = "Persistent semantic memory infrastructure for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.optional-dependencies]
mcp = [
    "mcp>=1.28.1,<2.0",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
]
nats = ["nats-py>=2.0.0"]
semantic = ["sqlite-vec==0.1.9"]
gate = [
    "torch>=2.13.0",
    "transformers>=4.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "bandit>=1.7.0",
    "build>=1.2.0",
    "pip-audit>=2.7.0",
    "cyclonedx-bom>=4.0.0",
]
all = [
    "mcp>=1.28.1,<2.0",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
    "nats-py>=2.0.0",
    "sqlite-vec==0.1.9",
    "torch>=2.13.0",
    "transformers>=4.0.0",
]

[project.scripts]
recall = "recall_mcp:main"
recall-mcp = "recall_mcp:main"
recall-service = "recall_mcp.serve:main"
recall-admin = "recall_mcp.admin:main"
remembrance-mcp = "remembrance_mcp:main"
remembrance-service = "remembrance_mcp.serve:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["recall_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["recall_mcp"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "recall_mcp.nats_sub",
]
ignore_errors = true
