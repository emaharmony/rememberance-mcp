server_name: recall
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/jetstream
  max_mem_store: 1GB
  max_file_store: 20GB
}

authorization {
  users: [
    {
      user: recall
      password: $NATS_RECALL_PASSWORD
      permissions: {
        publish: ["$JS.API.>", "$JS.ACK.>", "recall.agent.output.dlq"]
        subscribe: ["*.agent.output", "_INBOX.>"]
      }
    }
    {
      user: prism
      password: $NATS_PRISM_PASSWORD
      permissions: {
        publish: ["*.agent.output"]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
